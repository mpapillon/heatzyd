{% extends "base.html" %}

{% block title %}Connexion - heatzyd{% endblock %}

{% block content %}
<section>
  <h1>Connexion Heatzy</h1>

  {% if error %}
  <div class="alert alert-danger d-flex align-items-center gap-2" role="alert">{{ icon("alert") }}{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <p>
      <label for="username" class="form-label">Identifiant Heatzy</label>
      <input type="text" id="username" name="username" class="form-control" value="{{ username or '' }}"
             autocomplete="username" required autofocus>
    </p>
    <p>
      <label for="password" class="form-label">Mot de passe</label>
      <input type="password" id="password" name="password" class="form-control"
             autocomplete="current-password" required>
    </p>
    <p>
      <button type="submit" class="btn btn-primary d-inline-flex align-items-center gap-2">Se connecter</button>
    </p>
  </form>
</section>
{% endblock %}
