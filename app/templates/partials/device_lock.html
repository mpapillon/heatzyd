<label class="d-flex align-items-center gap-3" for="lock-{{ device.did }}">
  <span class="setting-icon setting-icon--lock">{{ icon('lock') }}</span>
  <span class="flex-grow-1">
    <span class="d-block">Verrou</span>
    <small class="text-body-secondary d-block">
        Empêche l'utilisation du bouton d'action physique et éteint les leds
    </small>
  </span>
  <span class="form-check form-switch m-0 flex-shrink-0">
    <input class="form-check-input" type="checkbox" role="switch"
           id="lock-{{ device.did }}"{% if device.lock %} checked{% endif %}
           hx-put="/devices/{{ device.did }}/lock"
           hx-vals='{"lock": "{{ 0 if device.lock else 1 }}"}'
           hx-trigger="click prevent"
           hx-swap="none"
           hx-disable="this"{% if not device.is_online %} disabled{% endif %}>
  </span>
</label>
